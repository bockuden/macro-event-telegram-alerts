name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bootstrap the Linux environment
        run: ./scripts/bootstrap.sh

      - name: Run Ruff lint checks
        run: .venv/bin/python -m ruff check .

      - name: Verify Ruff formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Run mypy
        run: .venv/bin/python -m mypy

      - name: Run pytest
        run: .venv/bin/python -m pytest

      - name: Build container image
        run: docker build --tag macro-event-telegram-alerts:ci .

      - name: Run container smoke test
        run: |
          docker image inspect macro-event-telegram-alerts:ci --format '{{.Config.User}}' | grep -Fx app
          docker run --rm macro-event-telegram-alerts:ci check-config --config /app/config.example.toml
