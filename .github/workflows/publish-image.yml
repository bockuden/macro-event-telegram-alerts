name: Publish container image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: macro-event-telegram-alerts
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run release quality checks
        run: |
          ./scripts/bootstrap.sh
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy
          .venv/bin/python -m pytest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Reliable Telegram reminders for significant macroeconomic events.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build release image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.IMAGE_NAME }}:release-smoke
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run pre-publish image smoke test
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' ${{ env.IMAGE_NAME }}:release-smoke)" = "app"
          docker run --rm ${{ env.IMAGE_NAME }}:release-smoke check-config --config /app/config.example.toml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify anonymous pull and smoke test
        run: |
          docker logout ${{ env.REGISTRY }} || true
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker run --rm \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            check-config --config /app/config.example.toml
