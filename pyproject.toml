[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-event-telegram-alerts"
version = "0.0.0"
description = "Reliable Telegram reminders for significant macroeconomic events."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Bockuden" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/bockuden/macro-event-telegram-alerts"
Issues = "https://github.com/bockuden/macro-event-telegram-alerts/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
